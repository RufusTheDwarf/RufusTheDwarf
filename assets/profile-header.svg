<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">RufusTheDwarf developer profile</title>
<desc id="desc">A dark violet technical interface with an orbital system graphic and the RufusTheDwarf name.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090711"/><stop offset=".55" stop-color="#120C20"/><stop offset="1" stop-color="#080B16"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#211532" stop-opacity=".92"/><stop offset="1" stop-color="#131426" stop-opacity=".5"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6C0FF"/><stop offset=".48" stop-color="#9B76D8"/><stop offset="1" stop-color="#6E62E8"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8158D8" stop-opacity=".30"/><stop offset="1" stop-color="#8158D8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9A80C8" stroke-opacity=".11" stroke-width="1"/></pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#C5B0EF" opacity=".28"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="glowline"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect width="1600" height="520" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <ellipse cx="1260" cy="245" rx="360" ry="300" fill="url(#glow)" filter="url(#soft)"/>
  <path d="M0 405H1600" stroke="#A78BFA" stroke-opacity=".16"/>
  <path d="M0 410H1600" stroke="#0D0A16" stroke-width="8"/>
  <path d="M0 12H1600M12 0V520M1588 0V520" stroke="#BBA4E8" stroke-opacity=".22" fill="none"/>
  <path d="M38 38H76M38 38V76M1562 38H1524M1562 38V76M38 482H76M38 482V444M1562 482H1524M1562 482V444" stroke="#B69AE8" stroke-width="2" opacity=".72" fill="none"/>

  <!-- Header metadata -->
  <g font-family="Consolas, 'Liberation Mono', monospace" fill="#B7A4D7" font-size="13" letter-spacing="2">
    <text x="92" y="74">PROFILE / 001</text>
    <text x="1508" y="74" text-anchor="end">INDEPENDENT DEVELOPMENT</text>
  </g>
  <path d="M92 94H710" stroke="#9170C7" stroke-opacity=".48"/>
  <circle cx="92" cy="94" r="3" fill="#C6A8FF"/>

  <!-- Main identity -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="205" fill="#F2ECFC" font-size="78" font-weight="700" letter-spacing="-2">RUFUS</text>
    <text x="90" y="293" fill="url(#violet)" font-size="78" font-weight="700" letter-spacing="-2">THE DWARF</text>
    <path d="M94 322H596" stroke="#A78BFA" stroke-width="2" opacity=".8"/>
    <path d="M94 322H220" stroke="#E1D2FF" stroke-width="2" filter="url(#glowline)"/>
    <text x="94" y="365" fill="#D4C8E6" font-size="19" letter-spacing="3">OPEN SOURCE  /  SYSTEMS  /  SOFTWARE</text>
  </g>
  <g font-family="Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1.5">
    <rect x="94" y="438" width="126" height="31" rx="4" fill="#211632" stroke="#7556A9"/>
    <text x="157" y="458" fill="#DCCBFA" text-anchor="middle">INFRASTRUCTURE</text>
    <rect x="232" y="438" width="86" height="31" rx="4" fill="#211632" stroke="#7556A9"/>
    <text x="275" y="458" fill="#DCCBFA" text-anchor="middle">TOOLS</text>
    <rect x="330" y="438" width="86" height="31" rx="4" fill="#211632" stroke="#7556A9"/>
    <text x="373" y="458" fill="#DCCBFA" text-anchor="middle">GAMES</text>
    <rect x="428" y="438" width="150" height="31" rx="4" fill="#211632" stroke="#7556A9"/>
    <text x="503" y="458" fill="#DCCBFA" text-anchor="middle">DOCUMENTATION</text>
  </g>

  <!-- Orbital system motif -->
  <g transform="translate(1245 256)">
    <circle r="182" fill="none" stroke="#6D5AA0" stroke-opacity=".22" stroke-width="1"/>
    <circle r="153" fill="none" stroke="#A78BFA" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="2 8"/>
    <circle r="121" fill="none" stroke="#8167B3" stroke-opacity=".65" stroke-width="1.4"/>
    <circle r="91" fill="#171026" stroke="#A78BFA" stroke-opacity=".8" stroke-width="1.4"/>
    <circle r="71" fill="none" stroke="#614D8A" stroke-opacity=".8" stroke-width="1"/>
    <g stroke="#B69AE8" stroke-opacity=".35" stroke-width="1">
      <path d="M-212 0H-182M182 0H212M0-212V-182M0 182V212"/>
      <path d="M-150-150L-129-129M150-150L129-129M-150 150L-129 129M150 150L129 129"/>
      <path d="M-121 0H-91M91 0H121M0-121V-91M0 91V121"/>
    </g>
    <g fill="#BFA7F2">
      <circle cx="0" cy="-153" r="4"/><circle cx="153" cy="0" r="3"/><circle cx="-153" cy="0" r="3"/><circle cx="0" cy="153" r="4"/>
    </g>
    <g fill="none" stroke="#9B76D8" stroke-width="1.6" opacity=".9">
      <path d="M-52-38L0-68L52-38V24L0 55L-52 24Z"/>
      <path d="M-52-38L0-8L52-38M0-8V55"/>
    </g>
    <text x="0" y="12" text-anchor="middle" fill="#EEE7FA" font-family="Consolas, monospace" font-size="54" font-weight="700">R</text>
    <g font-family="Consolas, monospace" text-anchor="middle" letter-spacing="2">
      <text x="0" y="-100" fill="#BDA8DF" font-size="10">BUILD / EXPLORE</text>
      <text x="0" y="112" fill="#BDA8DF" font-size="10">LEARN / SHARE</text>
    </g>
    <g>
      <circle cx="110" cy="-105" r="5" fill="#D2B9FF" filter="url(#glowline)">
        <animate attributeName="opacity" values=".45;1;.45" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-145" cy="-54" r="3" fill="#7D8CFF"><animate attributeName="r" values="2.5;4;2.5" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="rotate(0)">
      <ellipse rx="168" ry="64" transform="rotate(-34)" fill="none" stroke="#7962B8" stroke-opacity=".5" stroke-width="1.3" stroke-dasharray="5 9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Focus panel -->
  <g transform="translate(1450 160)" font-family="Consolas, 'Liberation Mono', monospace">
    <path d="M0 0H88V124H0Z" fill="url(#panel)" stroke="#7556A9" stroke-opacity=".7"/>
    <path d="M0 0H16M0 0V16M88 108V124H72" fill="none" stroke="#C4A9F5" stroke-width="2"/>
    <text x="44" y="28" text-anchor="middle" fill="#B9A5D7" font-size="9" letter-spacing="1">NOW</text>
    <text x="44" y="58" text-anchor="middle" fill="#F1E9FF" font-size="20" font-weight="bold">K3s</text>
    <path d="M18 72H70" stroke="#8064B3"/>
    <text x="44" y="91" text-anchor="middle" fill="#B9A5D7" font-size="8" letter-spacing=".6">PRIVATE</text>
    <text x="44" y="104" text-anchor="middle" fill="#B9A5D7" font-size="8" letter-spacing=".6">CLOUD</text>
  </g>
  <g font-family="Consolas, monospace" fill="#8F7AAE" font-size="10" letter-spacing="1.4">
    <text x="1508" y="332" text-anchor="end">NODE: CH-01</text>
    <text x="1508" y="350" text-anchor="end">MODE: OPEN</text>
    <text x="1508" y="368" text-anchor="end">STATUS: BUILDING</text>
  </g>

  <!-- Bottom interface strip -->
  <rect x="0" y="492" width="1600" height="28" fill="#0A0812" opacity=".96"/>
  <path d="M0 492H1600" stroke="#A78BFA" stroke-opacity=".48"/>
  <g font-family="Consolas, monospace" font-size="10" fill="#9E8BB9" letter-spacing="1.5">
    <text x="92" y="510">RUFUSTHEDWARF / GITHUB PROFILE</text>
    <text x="800" y="510" text-anchor="middle">BUILD  •  LEARN  •  SHARE</text>
    <text x="1508" y="510" text-anchor="end">EST. 2024 / OPEN SOURCE</text>
  </g>
</g>
</svg>