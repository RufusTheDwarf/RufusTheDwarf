<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc">
  <title id="title">Build. Learn. Share. Improve.</title>
  <desc id="desc">A simple violet wave footer marking the end of the RufusTheDwarf profile README.</desc>
  <defs>
    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35204F"/>
      <stop offset="0.52" stop-color="#60409A"/>
      <stop offset="1" stop-color="#35204F"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8056C9"/>
      <stop offset="0.48" stop-color="#B99AFF"/>
      <stop offset="1" stop-color="#8056C9"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B99AFF"/>
      <stop offset="0.5" stop-color="#F0EAF8"/>
      <stop offset="1" stop-color="#B99AFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="190" rx="12" fill="#0B0812"/>
  <path d="M0 25 C145 2 260 5 390 24 S635 47 785 22 S1055 1 1200 24" fill="none" stroke="#8056C9" stroke-opacity=".55" stroke-width="2"/>
  <path d="M0 35 C155 12 270 16 405 34 S650 56 805 32 S1065 12 1200 34" fill="none" stroke="#B99AFF" stroke-opacity=".24" stroke-width="1.2"/>

  <text x="600" y="100" text-anchor="middle" fill="url(#textGradient)"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" letter-spacing="4">
    BUILD <tspan fill="#8056C9">·</tspan> LEARN <tspan fill="#8056C9">·</tspan> SHARE <tspan fill="#8056C9">·</tspan> IMPROVE
  </text>
  <text x="600" y="126" text-anchor="middle" fill="#A79BB9"
        font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2.8">
    KEEP KNOWLEDGE OPEN. KEEP MAKING THINGS BETTER.
  </text>

  <path d="M0 137 C140 108 275 112 405 139 C555 170 680 160 810 136 C960 108 1080 110 1200 137 L1200 190 L0 190 Z" fill="url(#waveBack)" fill-opacity=".62"/>
  <path d="M0 153 C155 126 265 132 405 153 C545 174 685 177 825 150 C965 123 1090 128 1200 153 L1200 190 L0 190 Z" fill="url(#waveFront)" fill-opacity=".40"/>
  <path d="M0 165 C155 147 265 148 410 165 C570 184 700 183 845 163 C980 145 1090 149 1200 166 L1200 190 L0 190 Z" fill="#8056C9" fill-opacity=".28"/>
  <path d="M0 153 C155 126 265 132 405 153 C545 174 685 177 825 150 C965 123 1090 128 1200 153" fill="none" stroke="#B99AFF" stroke-opacity=".7" stroke-width="1.5"/>
</svg>
