<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="250" viewBox="0 0 1600 250" role="img" aria-labelledby="title desc">
<title id="title">Build learn share</title><desc id="desc">A dark violet technical footer with the profile motto and connected nodes.</desc>
