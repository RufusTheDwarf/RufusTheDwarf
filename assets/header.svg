<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">RufusTheDwarf — Independent Developer</title><desc id="desc">Animated dark technology banner with a custom HUD, circuitry, status panels and the RufusTheDwarf identity.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070B18"/><stop offset="0.52" stop-color="#0C1024"/><stop offset="1" stop-color="#111B35"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#101A31" stop-opacity=".96"/><stop offset="1" stop-color="#0A1020" stop-opacity=".94"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A78BFA"/><stop offset=".52" stop-color="#60A5FA"/><stop offset="1" stop-color="#67E8F9"/>
  </linearGradient>
  <linearGradient id="accentVertical" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <radialGradient id="glowViolet"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".34"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowBlue"><stop offset="0" stop-color="#38BDF8" stop-opacity=".25"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#8295C4" stroke-opacity=".10" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.2" fill="#A78BFA" fill-opacity=".28"/>
  </pattern>
  <pattern id="microgrid" width="8" height="8" patternUnits="userSpaceOnUse">
    <path d="M8 0H0V8" fill="none" stroke="#9BB1DB" stroke-opacity=".08" stroke-width=".6"/>
  </pattern>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="roundedClip"><rect x="0" y="0" width="1600" height="520" rx="24"/></clipPath>
  <style>
    text { text-rendering: geometricPrecision; }
    .mono { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; }
    .muted { fill:#8493B2; }
    .bright { fill:#EEF4FF; }
    .violet { fill:#B9A4FF; }
    .blue { fill:#7DD3FC; }
    .strokeAccent { stroke:url(#accent); }
    .pulse { animation:pulse 3.4s ease-in-out infinite; }
    .pulseSlow { animation:pulse 5.2s ease-in-out infinite; }
    .drift { animation:drift 8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .drift2 { animation:drift 11s ease-in-out infinite reverse; transform-box:fill-box; transform-origin:center; }
    .dash { stroke-dasharray:8 12; animation:dash 18s linear infinite; }
    .scan { animation:scan 8s linear infinite; }
    .blink { animation:blink 1.15s steps(2,end) infinite; }
    .glowPulse { animation:glowPulse 4s ease-in-out infinite; }
    @keyframes pulse {0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes drift {0%,100%{transform:translate(0,0)}50%{transform:translate(7px,-8px)}}
    @keyframes dash {to{stroke-dashoffset:-400}}
    @keyframes scan {0%{transform:translateY(-560px)}100%{transform:translateY(560px)}}
    @keyframes blink {0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes glowPulse {0%,100%{opacity:.42}50%{opacity:.95}}
    @media (prefers-reduced-motion: reduce) { .pulse,.pulseSlow,.drift,.drift2,.dash,.scan,.blink,.glowPulse { animation:none !important; } }
  </style>
</defs>

<g clip-path="url(#roundedClip)">
  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <rect width="1600" height="520" fill="url(#microgrid)" opacity=".5"/>
  <ellipse cx="410" cy="205" rx="500" ry="330" fill="url(#glowViolet)" class="glowPulse"/>
  <ellipse cx="1330" cy="330" rx="420" ry="300" fill="url(#glowBlue)" class="pulseSlow"/>
  <path d="M0 82H1600M0 438H1600" stroke="#7890C5" stroke-opacity=".18"/>
  <path d="M0 84H390L422 52H620M1600 436H1300L1268 468H1040" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="1.5"/>
  <!-- outer frame and corner registration marks -->
  <rect x="28" y="24" width="1544" height="472" rx="20" fill="none" stroke="#6379A6" stroke-opacity=".38"/>
  <path d="M48 72V48H72M1528 48H1552V72M48 448V472H72M1528 472H1552V448" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".85"/>
  <!-- header telemetry -->
  <g class="mono" font-size="12" letter-spacing="2.2">
    <text x="76" y="72" fill="#9AA9C8">PROFILE.SYS</text>
    <text x="1525" y="72" text-anchor="end" fill="#9AA9C8">PUBLIC / OPEN SOURCE</text>
    <text x="76" y="465" fill="#7183A9">NODE: RTD-001</text>
    <text x="1525" y="465" text-anchor="end" fill="#7183A9">BUILD • LEARN • SHARE</text>
  </g>
  <!-- identity mark -->
  <g transform="translate(82 128)">
    <rect width="76" height="76" rx="16" fill="#111B34" stroke="#8B78F6" stroke-opacity=".8"/>
    <rect x="7" y="7" width="62" height="62" rx="11" fill="url(#microgrid)"/>
    <path d="M18 24H58M18 38H48M18 52H58" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="38" r="4" fill="#67E8F9" class="pulse"/>
  </g>
  <g class="mono" font-size="11" letter-spacing="2.1" fill="#8FA0C1">
    <text x="82" y="229">INDEPENDENT / BUILDER</text>
    <text x="82" y="248">OPEN SOURCE MINDSET</text>
  </g>
  <!-- main typography -->
  <text x="80" y="327" class="sans bright" font-size="84" font-weight="800" letter-spacing="-3.2">RUFUS</text>
  <text x="80" y="401" class="sans" font-size="70" font-weight="650" letter-spacing="1.5" fill="url(#accent)">THE DWARF</text>
  <rect x="84" y="421" width="365" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="84" y="449" class="mono" font-size="13" letter-spacing="2.4" fill="#C3CDE2">MAKING TECHNOLOGY ACCESSIBLE TO EVERYONE</text>
  <!-- orbit / node motif -->
  <g transform="translate(915 260)" opacity=".8">
    <circle r="168" fill="none" stroke="#7385B2" stroke-opacity=".14" stroke-dasharray="2 12"/>
    <circle r="135" fill="none" stroke="#7C8BB7" stroke-opacity=".22" stroke-dasharray="4 9" class="dash"/>
    <circle r="104" fill="none" stroke="#8B5CF6" stroke-opacity=".32"/>
    <path d="M-176 0H176M0 -176V176" stroke="#8BA0C8" stroke-opacity=".14"/>
    <circle cx="-134" cy="-66" r="5" fill="#A78BFA" filter="url(#smallGlow)" class="pulse"/>
    <circle cx="114" cy="-112" r="4" fill="#67E8F9" filter="url(#smallGlow)" class="pulseSlow"/>
    <circle cx="152" cy="58" r="5" fill="#60A5FA" filter="url(#smallGlow)" class="pulse"/>
    <circle cx="-56" cy="145" r="3" fill="#A78BFA" class="pulseSlow"/>
    <path d="M-132 -66L-42 -22L0 0L112 -112M0 0L150 58" fill="none" stroke="url(#accent)" stroke-width="1.2" stroke-opacity=".5"/>
    <circle r="50" fill="#101B35" stroke="url(#accent)" stroke-width="1.6"/>
    <circle r="39" fill="url(#glowViolet)"/>
    <text text-anchor="middle" y="-4" class="mono" font-size="15" letter-spacing="2" fill="#F2F5FF">RTD</text>
    <text text-anchor="middle" y="17" class="mono" font-size="8" letter-spacing="1.5" fill="#8FA0C1">CORE</text>
  </g>
  <!-- right info console -->
  <g transform="translate(1120 112)">
    <rect width="390" height="292" rx="16" fill="url(#panel)" stroke="#6379A6" stroke-opacity=".48"/>
    <path d="M0 48H390" stroke="#7185B0" stroke-opacity=".35"/>
    <path d="M18 0H85L99 14H150" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="25" cy="24" r="4" fill="#67E8F9" class="pulse"/>
    <text x="42" y="28" class="mono" font-size="11" letter-spacing="2" fill="#A8B6D4">CURRENT FOCUS</text>
    <text x="24" y="83" class="mono" font-size="10" letter-spacing="1.8" fill="#7284A9">01 / INFRASTRUCTURE</text>
    <text x="24" y="108" class="sans bright" font-size="19" font-weight="650">Self-hosted systems</text>
    <path d="M24 126H362" stroke="#61749F" stroke-opacity=".25"/>
    <text x="24" y="158" class="mono" font-size="10" letter-spacing="1.8" fill="#7284A9">02 / DEVELOPMENT</text>
    <text x="24" y="183" class="sans bright" font-size="19" font-weight="650">Practical software</text>
    <path d="M24 201H362" stroke="#61749F" stroke-opacity=".25"/>
    <text x="24" y="233" class="mono" font-size="10" letter-spacing="1.8" fill="#7284A9">03 / DOCUMENTATION</text>
    <text x="24" y="258" class="sans bright" font-size="19" font-weight="650">Knowledge for everyone</text>
    <g transform="translate(322 20)"><circle r="5" fill="#34D399" class="pulse"/><circle r="10" fill="none" stroke="#34D399" stroke-opacity=".3"/></g>
  </g>
  <!-- animated scan line -->
  <rect x="28" y="0" width="1544" height="3" fill="url(#accent)" opacity=".2" class="scan"/>
  <path d="M1050 90L1050 430" stroke="#6E83B2" stroke-opacity=".16" stroke-dasharray="3 8"/>
  <g class="mono" font-size="9" fill="#7D8EAF" letter-spacing="1.2">
    <text x="1080" y="96">SYS.MONITOR // 01</text>
    <text x="1485" y="420" text-anchor="end">STATUS: <tspan fill="#6EE7B7">ONLINE</tspan></text>
  </g>
</g>
</svg>