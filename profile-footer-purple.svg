<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Open source, shared knowledge</title>
  <desc id="desc">A dark violet technical footer with a glowing open-source network emblem, connected nodes, a terminal motif and the message Build, Share, Improve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10091C"/>
      <stop offset="0.52" stop-color="#17102A"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8056C9"/>
      <stop offset="0.48" stop-color="#B99AFF"/>
      <stop offset="1" stop-color="#6C8CFF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8056C9" stop-opacity=".95"/>
      <stop offset="1" stop-color="#536BCE" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8056C9" stop-opacity=".26"/>
      <stop offset="1" stop-color="#8056C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#B99AFF" stroke-opacity=".055" stroke-width="1"/>
      <circle cx="1" cy="1" r="1" fill="#B99AFF" fill-opacity=".15"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round">
      <rect x="1" y="1" width="1198" height="318" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="930" cy="142" rx="260" ry="225" fill="url(#glow)"/>
    <path d="M0 8H1200" stroke="url(#violet)" stroke-width="4"/>
    <path d="M0 302H1200" stroke="#332442" stroke-width="1"/>

    <!-- Subtle circuit traces on the left -->
    <g fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".72">
      <path d="M0 72H64L92 100H155"/>
      <path d="M0 108H40L72 140H118"/>
      <path d="M0 248H62L91 219H148"/>
      <path d="M0 278H39L66 251H108"/>
      <path d="M1200 58H1138L1109 87H1066"/>
      <path d="M1200 91H1165L1134 122H1095"/>
      <path d="M1200 250H1142L1114 222H1060"/>
      <path d="M1200 281H1169L1139 251H1092"/>
    </g>
    <g fill="#B99AFF" opacity=".8">
      <circle cx="155" cy="100" r="3"/><circle cx="118" cy="140" r="3"/>
      <circle cx="148" cy="219" r="3"/><circle cx="108" cy="251" r="3"/>
      <circle cx="1066" cy="87" r="3"/><circle cx="1095" cy="122" r="3"/>
      <circle cx="1060" cy="222" r="3"/><circle cx="1092" cy="251" r="3"/>
    </g>

    <!-- Main copy -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
      <text x="92" y="87" fill="#B99AFF" font-size="12" letter-spacing="4">OPEN SOURCE / SHARED KNOWLEDGE</text>
      <text x="88" y="158" fill="#F0EAF8" font-size="48" font-weight="700" letter-spacing="1.5">BUILD.</text>
      <text x="264" y="158" fill="#B99AFF" font-size="48" font-weight="700" letter-spacing="1.5">SHARE.</text>
      <text x="486" y="158" fill="#F0EAF8" font-size="48" font-weight="700" letter-spacing="1.5">IMPROVE.</text>
      <path d="M92 184H626" stroke="url(#violet)" stroke-width="2" opacity=".9"/>
      <text x="92" y="216" fill="#C8B9DD" font-size="13" letter-spacing="1.4">SOURCE CODE  /  DOCUMENTATION  /  COMMUNITY</text>
      <text x="92" y="256" fill="#9384AA" font-size="11" letter-spacing="1.2">INSPECT IT. LEARN FROM IT. BUILD SOMETHING BETTER.</text>
    </g>

    <!-- Open-source network emblem -->
    <g transform="translate(904 157)">
      <circle r="107" fill="#8056C9" opacity=".055"/>
      <circle r="90" fill="none" stroke="#332442" stroke-width="1.2"/>
      <circle r="90" fill="none" stroke="url(#violet)" stroke-width="1.8" stroke-dasharray="2 9" opacity=".8"/>
      <circle r="68" fill="none" stroke="#8056C9" stroke-opacity=".45" stroke-dasharray="36 18" stroke-width="1.5"/>
      <path d="M-28 -20L0 -4L29 -28M0 -4L0 34M-28 -20L-28 32" fill="none" stroke="#B99AFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
      <path d="M-28 -20L0 -4L29 -28M0 -4L0 34M-28 -20L-28 32" fill="none" stroke="#D9C8FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-28" cy="-20" r="9" fill="#17102A" stroke="#B99AFF" stroke-width="2.4"/>
      <circle cx="29" cy="-28" r="9" fill="#17102A" stroke="#B99AFF" stroke-width="2.4"/>
      <circle cx="0" cy="34" r="9" fill="#17102A" stroke="#6C8CFF" stroke-width="2.4"/>
      <circle cx="0" cy="-4" r="5" fill="#D9C8FF" filter="url(#softGlow)"/>
      <path d="M-8 -52H8M-8 52H8M-52 -8V8M52 -8V8" stroke="#8056C9" stroke-width="1.5" opacity=".85"/>
      <circle r="116" fill="none" stroke="#536BCE" stroke-opacity=".18"/>
    </g>

    <!-- Small terminal signature -->
    <g transform="translate(720 260)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2">
      <rect x="0" y="-19" width="142" height="28" rx="5" fill="#10091C" stroke="#332442"/>
      <circle cx="13" cy="-5" r="2.5" fill="#8056C9"/>
      <circle cx="23" cy="-5" r="2.5" fill="#536BCE"/>
      <text x="35" y="-1" fill="#C8B9DD">git contribute</text>
    </g>

    <text x="1110" y="298" fill="#796B91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" text-anchor="end" letter-spacing="2">RUFUSTHEDWARF / OPEN WORK</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#574078" stroke-opacity=".6" stroke-width="1.2"/>
</svg>
